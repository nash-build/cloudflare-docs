[package]
name = "voicecore-wasm"
description = "WebAssembly bindings for the voicecore engine: run single-mic voice isolation in the browser (AudioWorklet) or Electron, feeding cleaned audio to the ElevenLabs JS SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voicecore = { path = "../voicecore" }
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
