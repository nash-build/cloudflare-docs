[package]
name = "verballi-wasm"
description = "WebAssembly bindings for the verballi engine: run single-mic voice isolation in the browser (AudioWorklet) or Electron, feeding cleaned audio to the ElevenLabs JS SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
verballi = { path = "../verballi" }
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
