# CI for the standalone google-mcp-server repository.
#
# NOTE: GitHub only runs workflows from `.github/workflows/` at the repository
# root. While this project lives inside the cloudflare-docs repo it will NOT
# run there; it activates once the project is extracted into its own repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
