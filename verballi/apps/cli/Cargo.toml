[package]
name = "verballi-cli"
description = "Reference CLI for the verballi engine: enroll a voice, isolate a WAV file, or stream a cleaned mic into an ElevenLabs agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "verballi"
path = "src/main.rs"

[dependencies]
verballi = { path = "../../crates/verballi" }
verballi-deepfilter = { path = "../../crates/verballi-deepfilter" }
hound = "3.5"

# Live mic capture + ElevenLabs streaming. Optional so the core CLI (enroll /
# process-file) builds with no system audio or network dependencies.
cpal = { version = "0.15", optional = true }
tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
serde_json = { version = "1", optional = true }
ureq = { version = "2", optional = true }

[features]
default = []
# Enable real-time mic capture and ElevenLabs agent streaming.
live = ["dep:cpal", "dep:tungstenite", "dep:serde_json", "dep:ureq"]
