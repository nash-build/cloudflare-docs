name = "paige-checklist"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Create the KV namespace, then paste its id below:
#   npx wrangler kv namespace create PAIGE_KV
kv_namespaces = [
  { binding = "PAIGE_KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# Set the shared secret (do NOT commit it):
#   npx wrangler secret put PAIGE_TOKEN
# vars left empty on purpose; PAIGE_TOKEN comes from `wrangler secret put`.
